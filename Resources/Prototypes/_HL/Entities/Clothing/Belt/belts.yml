- type: entity
  parent: [NFClothingBeltStorageBase, ContentsExplosionResistanceBase, BaseC1Contraband ]
  id: ClothingBeltUtilitySyndicate
  name: blood-red utility belt
  description: It can hold various tools while looking fresh as fuck.
  components:
  - type: Sprite
    sprite: _HL/Clothing/Belt/utility.rsi
  - type: Clothing
    sprite: _HL/Clothing/Belt/utility.rsi
  - type: Storage
  - type: ItemMapper
    mapLayers:
      drill:
        whitelist:
          tags:
          - Syndie_Powerdrill
      jaws:
        whitelist:
          tags:
          - Syndie_JawsOfLife
      multitool:
        whitelist:
          tags:
          - Syndie_Multitool
    sprite: _HL/Clothing/Belt/belt_overlay.rsi
  - type: Appearance

- type: entity
  parent: ClothingBeltUtilitySyndicate
  id: ClothingBeltUtilitySyndicateFilled
  suffix: filled
  components:
  - type: StorageFill
    contents:
    - id: SyndicateJawsOfLife
    - id: SyndicateWelderExperimental
    - id: SyndicatePowerDrill
    - id: SyndicateMultitool
    - id: ClothingHandsGlovesCombat
    - id: ClothingMaskGasSyndicate
    
- type: entity
  parent: [ClothingBeltBase, ClothingSlotBase, BaseColcommContraband] # Frontier: BaseCommandContraband<BaseC1Contraband
  id: ClothingBeltOrnateSheath
  name: ornate sabre sheath
  description: An especially ornate sheath designed to hold an officer's blade.
  components:
  - type: Sprite
    sprite: _HL/Clothing/Belt/ornatesheath.rsi
    state: sheath
  - type: Clothing
    sprite: _HL/Clothing/Belt/ornatesheath.rsi
    #- type: Item # Frontier
    #size: Ginormous # Frontier
  - type: ItemSlots
    slots:
      item:
        name: Sabre
        insertVerbText: sheath-insert-verb
        ejectVerbText: sheath-eject-verb
        insertSound: /Audio/Items/sheath.ogg
        ejectSound: /Audio/Items/unsheath.ogg
        whitelist:
          tags:
          - CCSabre
          - CaptainSabre
  - type: ItemMapper
    mapLayers:
      sheath-sabre:
        whitelist:
          tags:
          - CCSabre
          - CaptainSabre
  - type: Appearance

- type: entity
  id: ClothingBeltOrnateSheathFilled
  parent: ClothingBeltOrnateSheath
  suffix: Filled, CCSabre
  components:
  - type: ContainerFill
    containers:
      item:
      - CCOfficerSabre
